[package]
name = "trusted-relay-secret-broker"
version = "0.1.0"
edition = "2021"

[dependencies]
relay-attest = { path = "../../crates/relay-attest", default-features = false }
relay-core = { path = "../../crates/relay-core" }
relay-secret = { path = "../../crates/relay-secret", default-features = false }
anyhow.workspace = true
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls = "0.26"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "service"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
mock = ["relay-attest/mock", "relay-secret/mock"]
sev-snp = ["relay-attest/sev-snp", "relay-secret/sev-snp"]
gcp-confidential-space = ["relay-attest/gcp-confidential-space", "relay-secret/gcp-confidential-space"]
