[package]
name = "trusted-relay-server"
version = "0.1.0"
edition = "2021"

[dependencies]
relay-core = { path = "../crates/relay-core" }
relay-attest = { path = "../crates/relay-attest", default-features = false }
relay-tls = { path = "../crates/relay-tls" }
axum = "0.8"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rustls = { workspace = true, features = ["ring"] }
tokio-rustls = "0.26"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[features]
default = []
tee-mock = ["relay-attest/mock"]
tee-tdx = ["relay-attest/tdx"]
tee-sev-snp = ["relay-attest/sev-snp"]
tee-gcp-confidential-space = ["relay-attest/gcp-confidential-space"]
tee-sev-snp-with-mock-fallback = ["tee-sev-snp", "tee-mock"]

[dev-dependencies]
relay-sdk = { path = "../crates/relay-sdk", features = ["mock"] }
relay-attest = { path = "../crates/relay-attest", features = ["mock"] }
axum = "0.8"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "service"] }
