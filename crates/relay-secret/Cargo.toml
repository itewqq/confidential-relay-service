[package]
name = "relay-secret"
version = "0.1.0"
edition = "2021"

[dependencies]
relay-attest = { path = "../relay-attest", default-features = false }
relay-core = { path = "../relay-core" }
relay-tls = { path = "../relay-tls" }
anyhow.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex = "0.4"
tracing.workspace = true
rustls = { workspace = true, features = ["ring"] }

[features]
default = []
mock = ["relay-attest/mock"]
sev-snp = ["relay-attest/sev-snp"]
gcp-confidential-space = ["relay-attest/gcp-confidential-space"]

[dev-dependencies]
relay-attest = { path = "../relay-attest", features = ["mock"] }
