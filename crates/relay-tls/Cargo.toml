[package]
name = "relay-tls"
version = "0.1.0"
edition = "2021"

[dependencies]
relay-attest = { path = "../relay-attest" }
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.13"
x509-parser = "0.16"
sha2.workspace = true
hex = "0.4"
tokio.workspace = true
tokio-rustls = "0.26"
anyhow.workspace = true
tracing.workspace = true
webpki = { package = "rustls-webpki", version = "0.102" }
