[workspace]
resolver = "2"
members = [
    "crates/relay-attest",
    "crates/relay-tls",
    "crates/relay-core",
    "crates/relay-sdk",
    "server",
    "tools/online-check",
    "tools/gateway",
    "tools/local-proxy",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
rustls = "0.23"
zeroize = { version = "1", features = ["derive"] }
rsa = "0.9.8"
